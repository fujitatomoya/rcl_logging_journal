<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">rcl_logging_journal: ROS 2 logging into the systemd journal</text>

  <!-- ROS 2 application -->
  <rect x="40" y="70" width="260" height="120" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="170" y="98" text-anchor="middle" font-weight="bold" fill="#1a365d">ROS 2 application</text>
  <text x="170" y="120" text-anchor="middle" fill="#2d3748">rclcpp / rclpy nodes</text>
  <text x="170" y="142" text-anchor="middle" fill="#2d3748">RCLCPP_INFO(...), RCLPY logger ...</text>
  <text x="170" y="168" text-anchor="middle" fill="#4a5568" font-size="12">rcl -> rcl_logging_interface</text>

  <!-- backend -->
  <rect x="40" y="230" width="260" height="120" rx="10" fill="#fff5e6" stroke="#c05621" stroke-width="2"/>
  <text x="170" y="258" text-anchor="middle" font-weight="bold" fill="#7b341e">rcl_logging_journal</text>
  <text x="170" y="280" text-anchor="middle" fill="#2d3748">severity -> PRIORITY</text>
  <text x="170" y="300" text-anchor="middle" fill="#2d3748">logger name -> ROS2_NODE_NAME</text>
  <text x="170" y="320" text-anchor="middle" fill="#2d3748">extra fields, SYSLOG_IDENTIFIER</text>
  <text x="170" y="340" text-anchor="middle" fill="#4a5568" font-size="12">sd_journal_sendv(): one datagram per record</text>

  <line x1="170" y1="190" x2="170" y2="228" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- socket -->
  <line x1="300" y1="290" x2="398" y2="290" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="349" y="272" text-anchor="middle" font-size="12" fill="#4a5568">AF_UNIX / SOCK_DGRAM</text>
  <text x="349" y="310" text-anchor="middle" font-size="11" fill="#4a5568">/run/systemd/journal/socket</text>
  <text x="349" y="326" text-anchor="middle" font-size="11" fill="#4a5568">(sealed memfd for big records)</text>

  <!-- journald -->
  <rect x="400" y="230" width="240" height="120" rx="10" fill="#e6fffa" stroke="#2c7a7b" stroke-width="2"/>
  <text x="520" y="258" text-anchor="middle" font-weight="bold" fill="#234e52">systemd-journald</text>
  <text x="520" y="280" text-anchor="middle" fill="#2d3748">adds trusted _PID, _UID, _COMM,</text>
  <text x="520" y="298" text-anchor="middle" fill="#2d3748">_EXE, _BOOT_ID, _HOSTNAME ...</text>
  <text x="520" y="320" text-anchor="middle" fill="#2d3748">rate limit, rotation, vacuum</text>
  <text x="520" y="340" text-anchor="middle" fill="#4a5568" font-size="12">no text parsing, no second daemon</text>

  <!-- journal files -->
  <line x1="520" y1="350" x2="520" y2="398" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="400" y="400" width="240" height="90" rx="10" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="520" y="426" text-anchor="middle" font-weight="bold" fill="#2d3748">journal files</text>
  <text x="520" y="446" text-anchor="middle" font-size="12" fill="#2d3748">/var/log/journal/&lt;machine-id&gt;/*.journal</text>
  <text x="520" y="464" text-anchor="middle" font-size="12" fill="#2d3748">append-only, indexed fields,</text>
  <text x="520" y="480" text-anchor="middle" font-size="12" fill="#2d3748">dedup + zstd compression</text>

  <!-- journalctl -->
  <line x1="640" y1="290" x2="738" y2="290" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="740" y="230" width="200" height="120" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <text x="840" y="258" text-anchor="middle" font-weight="bold" fill="#44337a">journalctl</text>
  <text x="840" y="282" text-anchor="middle" font-size="12" fill="#2d3748">-f ROS2_NODE_NAME=talker</text>
  <text x="840" y="300" text-anchor="middle" font-size="12" fill="#2d3748">-b -p warning ROS2_DISTRO=rolling</text>
  <text x="840" y="318" text-anchor="middle" font-size="12" fill="#2d3748">-o json / -o verbose</text>
  <text x="840" y="336" text-anchor="middle" font-size="12" fill="#2d3748">--vacuum-time=7d</text>

  <!-- optional forwarding -->
  <line x1="640" y1="440" x2="738" y2="440" stroke="#888" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <rect x="740" y="400" width="200" height="90" rx="10" fill="#f7fafc" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="840" y="426" text-anchor="middle" font-weight="bold" fill="#4a5568">optional forwarding</text>
  <text x="840" y="446" text-anchor="middle" font-size="12" fill="#4a5568">systemd-journal-remote / upload</text>
  <text x="840" y="462" text-anchor="middle" font-size="12" fill="#4a5568">FluentBit systemd input</text>
  <text x="840" y="478" text-anchor="middle" font-size="12" fill="#4a5568">rsyslog imjournal, Loki ...</text>

  <!-- container note -->
  <rect x="40" y="400" width="320" height="90" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="200" y="426" text-anchor="middle" font-weight="bold" fill="#22543d">container to host journal</text>
  <text x="200" y="448" text-anchor="middle" font-size="12" fill="#2d3748">docker run -v /run/systemd/journal/socket:</text>
  <text x="200" y="464" text-anchor="middle" font-size="12" fill="#2d3748">/run/systemd/journal/socket ...</text>
  <text x="200" y="480" text-anchor="middle" font-size="12" fill="#2d3748">logs land in the HOST journal, no daemon in the image</text>

  <!-- records -->
  <rect x="330" y="70" width="610" height="130" rx="10" fill="#fffff0" stroke="#b7791f" stroke-width="2"/>
  <text x="635" y="94" text-anchor="middle" font-weight="bold" fill="#744210">one record = indexed KEY=VALUE fields</text>
  <text x="350" y="118" font-family="monospace" font-size="12" fill="#2d3748">MESSAGE=[INFO] [1724869818.620827927] [talker]: Publishing: 'Hello World: 1'</text>
  <text x="350" y="136" font-family="monospace" font-size="12" fill="#2d3748">PRIORITY=6   ROS2_SEVERITY=INFO   ROS2_NODE_NAME=talker   ROS2_DISTRO=rolling</text>
  <text x="350" y="154" font-family="monospace" font-size="12" fill="#2d3748">SYSLOG_IDENTIFIER=talker   ROBOT_ID=amr-07   FLEET=tokyo   (extra fields)</text>
  <text x="350" y="172" font-family="monospace" font-size="12" fill="#4a5568">_PID=31348 _UID=1000 _COMM=talker _EXE=... _BOOT_ID=... _HOSTNAME=...  (trusted, by journald)</text>
  <text x="350" y="190" font-size="11" fill="#744210">repeated values are stored once (field deduplication), large values are compressed</text>
</svg>
