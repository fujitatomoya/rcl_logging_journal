# ABI compatibility check for librcl_logging_journal.so on every pull request.
#
# This is a thin wrapper around the reusable ros2-abi-action workflow, which:
#   1. resolves the ROS 2 distro from the PR target branch (rolling/lyrical/kilted/jazzy/humble),
#   2. builds the package twice in the matching ghcr.io/fujitatomoya/ros-abi:<distro>
#      container (once against the target branch, once against the PR head) with
#      -g -Og so DWARF debug info is present,
#   3. delegates the binary ABI diff to fujitatomoya/libabigail-action (abidiff),
#   4. applies REP-0009 policy automatically: released distros fail on an
#      incompatible ABI break, rolling is advisory only,
#   5. surfaces the verdict as a sticky PR comment, a label, and a pass/fail check.
#      Exactly one of the two labels remains after a run, or neither when the diff
#      could not be produced (e.g. build error).
#
# The labels are consumed by .mergify/config.yml to decide backports:
#   "ABI compatible" -> backport-all  -> backported to every supported distribution,
#   "ABI break"      -> skip-backport -> not backported anywhere.
# Keep the label names below and the ones in .mergify/config.yml in sync.
#
# See https://github.com/fujitatomoya/ros2-abi-action for all inputs and details.
name: abi

on:
  pull_request:
    branches: [ "rolling", "lyrical", "kilted", "jazzy", "humble" ]

# A new push to the same PR supersedes the previous ABI run, so a stale run
# cannot overwrite the labels of a newer one.
concurrency:
  group: abi-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  abi:
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # TODO(fujitatomoya): pin to @v1 once the tag is moved past the fixes
    # currently only on main (v1 still points at 1.0.0).
    uses: fujitatomoya/ros2-abi-action/.github/workflows/check.yml@main
    with:
      # Colcon package name to build. Built in the default binary mode, i.e. against
      # the released ros-<distro>-* packages, which is right for a downstream package.
      package: rcl_logging_journal
      # Shared library produced by this package.
      soname: librcl_logging_journal.so
      # Labels applied from the verdict; .mergify/config.yml keys off these.
      label-compat: ABI compatible
      label-break: ABI break
      # Uncomment to filter known-benign ABI deltas with a repo-level spec.
      # A configured-but-missing file is reported as a warning on every run.
      # suppressions: .abignore
