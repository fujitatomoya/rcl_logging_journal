# Backport rules. The ABI verdict labels ("ABI compatible" / "ABI break") are set by
# .github/workflows/abi.yaml, which also derives "skip-backport" / "backport-all" from them.
# The conditions below make the same policy hold even if that labeling step did not run:
#   - an ABI-incompatible change is never backported to a released, ABI-stable branch,
#   - an automatic backport requires a positive "ABI compatible" verdict,
#   - without a verdict, a reviewer opts in with explicit backport-* labels.
pull_request_rules:
  - name: automatic backport to all supported distribution
    description: |
      This rule backports a PR to all supported distribution branches when it is merged
      with an "ABI compatible" verdict, unless an explicit backport-* label selects the
      target branches.
    conditions:
      - base=rolling
      - merged
      - label=ABI compatible  # Positive verdict from abi.yaml is required for auto backport
      - label!=ABI break  # Never backport an ABI break to released distributions
      - label!=skip-backport  # Do not backport if this label exists
      - -label~=^backport-  # Explicit backport-* labels take over (rules below)
    actions:
      backport:
        branches:
          - lyrical
          - kilted
          - jazzy
          - humble

  - name: backport at reviewers discretion
    description: |
      This rule backports a PR to all supported distribution branches when it is labeled.
    conditions:
      - base=rolling
      - "label=backport-all"
      - merged
      - label!=ABI break  # Never backport an ABI break to released distributions
      - label!=skip-backport  # Do not backport if this label exists
    actions:
      backport:
        branches:
          - lyrical
          - kilted
          - jazzy
          - humble

  - name: backport to lyrical at reviewers discretion
    description: |
      This rule backports a PR to the lyrical distribution branch when it is labeled.
    conditions:
      - base=rolling
      - "label=backport-lyrical"
      - merged
      - label!=ABI break  # Never backport an ABI break to released distributions
      - label!=skip-backport  # Do not backport if this label exists
    actions:
      backport:
        branches:
          - lyrical

  - name: backport to kilted at reviewers discretion
    description: |
      This rule backports a PR to the kilted distribution branch when it is labeled.
    conditions:
      - base=rolling
      - "label=backport-kilted"
      - merged
      - label!=ABI break  # Never backport an ABI break to released distributions
      - label!=skip-backport  # Do not backport if this label exists
    actions:
      backport:
        branches:
          - kilted

  - name: backport to jazzy at reviewers discretion
    description: |
      This rule backports a PR to the jazzy distribution branch when it is labeled.
    conditions:
      - base=rolling
      - "label=backport-jazzy"
      - merged
      - label!=ABI break  # Never backport an ABI break to released distributions
      - label!=skip-backport  # Do not backport if this label exists
    actions:
      backport:
        branches:
          - jazzy

  - name: backport to humble at reviewers discretion
    description: |
      This rule backports a PR to the humble distribution branch when it is labeled.
    conditions:
      - base=rolling
      - "label=backport-humble"
      - merged
      - label!=ABI break  # Never backport an ABI break to released distributions
      - label!=skip-backport  # Do not backport if this label exists
    actions:
      backport:
        branches:
          - humble
