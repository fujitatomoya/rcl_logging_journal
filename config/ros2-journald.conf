#
# ROS 2 oriented systemd-journald drop-in for rcl_logging_journal.
#
# This file is OPTIONAL. rcl_logging_journal works with the stock journald
# configuration; this drop-in only tunes rate limits and retention for robots
# that log a lot. Review every value before use.
#
# Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp ros2-journald.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#
# Reference: journald.conf(5)
#   https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
#

[Journal]

# --- Storage --------------------------------------------------------------
# persistent: keep logs across reboots under /var/log/journal (the directory
#             is created automatically when Storage=persistent).
# volatile:   keep logs in RAM under /run/log/journal only.
# auto (default): persistent only if /var/log/journal already exists.
Storage=persistent

# Compress DATA objects larger than this threshold (zstd on modern systemd).
# Typical short ROS log lines stay below it and take the uncompressed fast path,
# large payloads such as backtraces or parameter dumps are compressed.
Compress=yes
# (systemd >= 245) explicit threshold; default is 512 bytes.
#Compress=512

# --- Retention ------------------------------------------------------------
# Upper bound for all journal files of this system. journald rotates and
# vacuums automatically to stay below it. Adjust to the disk of your robot.
SystemMaxUse=2G
# Keep at least this much free on the file system.
SystemKeepFree=1G
# Rotate individual files at this size so vacuuming has fine granularity.
SystemMaxFileSize=128M
# Drop entries older than this (0 disables time based retention).
MaxRetentionSec=1month

# --- Rate limiting --------------------------------------------------------
# journald drops messages from a service that logs more than RateLimitBurst
# messages within RateLimitIntervalSec and records "Suppressed N messages".
# A chatty ROS 2 node (e.g. DEBUG level at high frequency) can hit the
# default 10000 / 30s easily. Raise the burst, or set either to 0 to disable.
# NOTE: this is global; for a single node running as a systemd unit prefer
#       LogRateLimitBurst= / LogRateLimitIntervalSec= in the unit file.
RateLimitIntervalSec=30s
RateLimitBurst=100000

# --- Durability -----------------------------------------------------------
# journald fsyncs on this interval for INFO/WARN/ERROR records, and
# immediately for CRIT and above. rcl_logging_journal maps ROS FATAL to CRIT,
# so FATAL records are durable at once without changing this value.
SyncIntervalSec=5m

# --- Forwarding -----------------------------------------------------------
# Native records can be forwarded to a syslog daemon (rsyslog imjournal or
# imuxsock) or to the console in addition to being stored in the journal.
# Not needed for rcl_logging_journal; keep the defaults unless you have a
# syslog based pipeline as well.
#ForwardToSyslog=no
#ForwardToConsole=no
