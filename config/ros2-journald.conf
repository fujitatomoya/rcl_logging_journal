#
# ROS 2 oriented systemd-journald drop-in for rcl_logging_journal.
#
# This file is OPTIONAL. rcl_logging_journal works with the stock journald
# configuration; this drop-in only tunes rate limits and retention for robots
# that log a lot. Review every value before use.
#
# Sizing assumptions behind the numbers below (adjust to your robot):
#   - one robot computer with ~1 TB of local storage shared with sensor data
#   - on the order of 100 ROS 2 nodes running at the same time
#   - typical journal cost of roughly 300 to 500 bytes per record on disk
#     (short MESSAGE + per-record timestamp + entry index; the constant fields
#     are deduplicated). Measure it with scripts/benchmark (B4) on your own
#     message mix instead of trusting this estimate.
#
#   nodes x rate          records/day   journal/day (at ~400 B)
#   100 x  1 msg/s          8.6 M          ~3.5 GB
#   100 x  5 msg/s         43   M         ~17   GB
#   100 x 20 msg/s        173   M         ~70   GB  (DEBUG level territory)
#
# Install:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp ros2-journald.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#   journalctl --disk-usage          # confirm the journal is where you expect
#
# Reference: journald.conf(5)
#   https://www.freedesktop.org/software/systemd/man/latest/journald.conf.html
#

[Journal]

# --- Storage --------------------------------------------------------------
# persistent: keep logs across reboots under /var/log/journal (the directory
#             is created automatically when Storage=persistent).
# volatile:   keep logs in RAM under /run/log/journal only.
# auto (default): persistent only if /var/log/journal already exists.
#
# Embedded boards: journald only ever writes to /var/log/journal. If the root
# file system lives on a small eMMC or SD card and the large SSD is a separate
# mount, the journal lands on the small flash, which fills up and wears out
# under GBs per day. Either boot from the SSD, or bind-mount /var/log/journal
# from it in /etc/fstab (journald buffers in /run until
# systemd-journal-flush.service runs after local file systems are mounted,
# so a plain fstab entry is enough). Check with:
#   df -h /var/log/journal
Storage=persistent

# Compress DATA objects larger than this threshold (zstd on modern systemd).
# Typical short ROS log lines stay below it and take the uncompressed fast path,
# large payloads such as backtraces or parameter dumps are compressed.
Compress=yes
# (systemd >= 245) explicit threshold; default is 512 bytes.
#Compress=512

# --- Retention ------------------------------------------------------------
# Upper bound for all journal files of this system. journald rotates and
# vacuums automatically to stay below it. The disk is shared with image data
# and rosbags, so the journal gets a deliberately small slice. At the rates in
# the table above 10 GB is roughly 3 days of look-back at 1 msg/s per node and
# about 14 hours at 5 msg/s per node. If incident analysis needs more history,
# raise this before lowering log levels; 1 GB is 0.1 % of the disk.
SystemMaxUse=10G
# Keep at least this much free on the file system. journald shrinks its own
# files below SystemMaxUse to honour it, so a disk filled by image data makes
# journald drop logs first. Keep it small so logs survive a nearly full disk.
SystemKeepFree=10G
# Rotate individual files at this size. Larger files mean fewer files for
# journalctl to open and interleave on every query; smaller files mean finer
# vacuum granularity. 256 MB is about 40 files at the cap, so a vacuum frees
# 2.5 % at a time instead of a whole day.
SystemMaxFileSize=256M
# Upper bound on the number of archived files. Must be at least
# SystemMaxUse / SystemMaxFileSize or the file count, not the size, becomes
# the effective limit (the default is 100, enough for 40 files).
SystemMaxFiles=100
# Drop entries older than this (0 disables time based retention). The size cap
# above is the real limit at normal rates; this is a backstop for quiet
# periods (robot parked for weeks).
MaxRetentionSec=1month

# --- Rate limiting --------------------------------------------------------
# journald drops messages from a service (cgroup) that logs more than
# RateLimitBurst messages within RateLimitIntervalSec and records
# "Suppressed N messages". The effective burst is multiplied by a factor
# derived from the free journal space (x4 around 4 to 64 GB, x5 at 64 GB,
# x6 at 1 TB; the space counted is capped by SystemMaxUse), so with
# SystemMaxUse=10G the value below allows about 800 k records / 30 s,
# i.e. ~27 k records/s, before journald starts dropping.
#
# IMPORTANT for a ~100 node robot: the bucket is PER CGROUP, not per node.
# All nodes started from one `ros2 launch` under one systemd unit (or one
# terminal session) share a single budget. 100 nodes at INFO rates fit easily;
# 100 nodes at DEBUG can exceed it. Options, in order of preference:
#   1. split the stack into several systemd units, each gets its own budget,
#      and tune LogRateLimitBurst= / LogRateLimitIntervalSec= per unit;
#   2. raise the global burst below further;
#   3. set either value to 0 to disable rate limiting entirely. journald is
#      single threaded (about 6 to 8 us per record on a desktop core, more on
#      an embedded ARM core), so a runaway node then costs one CPU core at
#      worst; the
#      journal size stays bounded by SystemMaxUse.
RateLimitIntervalSec=30s
RateLimitBurst=200000

# --- Durability -----------------------------------------------------------
# journald fsyncs on this interval for INFO/WARN/ERROR records, and
# immediately for CRIT and above. rcl_logging_journal maps ROS FATAL to CRIT,
# so FATAL records are durable at once without changing this value.
# An AMR can lose power abruptly (emergency stop, battery swap); the records
# of the last SyncIntervalSec may be lost then. An fsync per minute on an SSD
# is cheap, so this is lowered from the 5 min default. Lower it further if
# post-incident analysis needs the last seconds of ERROR/WARN traffic.
SyncIntervalSec=1min

# --- Forwarding -----------------------------------------------------------
# Native records can be forwarded to a syslog daemon or to the console in
# addition to being stored in the journal. Not needed for rcl_logging_journal.
#
# ForwardToSyslog: upstream defaults to no, but Debian and Ubuntu builds
# default to yes. With rsyslog installed every record is then
# written a second time as text into /var/log/syslog and rotated by logrotate,
# doubling the disk traffic of a 100 node robot. Set it to no unless you
# really have a syslog based pipeline (rsyslog imuxsock / imjournal).
ForwardToSyslog=no
# ForwardToConsole copies every record to /dev/console (the serial debug port
# or the text console of the board). It does not affect the stdout of
# `ros2 run` or `ros2 launch`; that output comes from rcutils inside the node
# process.
# Default is no; enabling it only slows the serial console down.
#ForwardToConsole=no

# --- Alternative: a dedicated journal namespace ---------------------------
# With this many nodes it can be worth giving the ROS 2 stack its own journald
# instance (systemd >= 245) so OS logs stay small and readable and the robot
# logs can be vacuumed independently:
#   /etc/systemd/journald@ros2.conf  with the [Journal] values from this file
#   LogNamespace=ros2                in the [Service] section of the ROS units
#   journalctl --namespace=ros2 ...  to read them
# See doc/tutorials/Rate_Limits_And_Retention.md, section 6.
